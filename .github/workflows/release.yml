name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CMD_PKG: github.com/petal-labs/petaltrace/cmd/petaltrace
  API_PKG: github.com/petal-labs/petaltrace/api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set version info
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w \
            -X '${CMD_PKG}.Version=${VERSION}' \
            -X '${CMD_PKG}.Commit=${COMMIT}' \
            -X '${CMD_PKG}.BuildDate=${BUILD_DATE}' \
            -X '${API_PKG}.Version=${VERSION}' \
            -X '${API_PKG}.Commit=${COMMIT}' \
            -X '${API_PKG}.BuildDate=${BUILD_DATE}'"

          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/petaltrace-linux-amd64 ./main.go

          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/petaltrace-linux-arm64 ./main.go

          echo "Building darwin/amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/petaltrace-darwin-amd64 ./main.go

          echo "Building darwin/arm64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/petaltrace-darwin-arm64 ./main.go

          echo "Building windows/amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/petaltrace-windows-amd64.exe ./main.go

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/petaltrace-linux-amd64
            dist/petaltrace-linux-arm64
            dist/petaltrace-darwin-amd64
            dist/petaltrace-darwin-arm64
            dist/petaltrace-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
